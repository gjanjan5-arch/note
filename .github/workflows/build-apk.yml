name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Add Android Platform & Sync
        run: |
          npx cap add android || true
          npx cap sync

      - name: Setup Signing Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/tindahan-release.jks
          
          # Inject signing config into build.gradle automatically
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('tindahan-release.jks')
                      storePassword '${{ secrets.KEYSTORE_PASSWORD }}'
                      keyAlias '${{ secrets.KEY_ALIAS }}'
                      keyPassword '${{ secrets.KEYSTORE_PASSWORD }}'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Make Gradle Executable
        run: chmod +x android/gradlew
        

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Rename APK File
        run: |
          cd android/app/build/outputs/apk/debug/
          mv *.apk Tindahan-Notes.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tindahan-notes-apk
          path: android/app/build/outputs/apk/debug/Tindahan-Notes.apk
